# ==========================================================================
# A game server reachable from the internet without publishing your home IP.
#
# The game container has no network of its own. It runs inside the network
# namespace of a WireGuard sidecar, which dials OUT to a small relay VPS. The
# VPS holds the public address, forwards the game's UDP port down the tunnel,
# and masquerades the return path. Players connect to the VPS. Your home
# address never appears in a server list, a query response, or a traceroute.
#
#   relay-wg     WireGuard client. Owns the namespace. Dials the VPS.
#   game         The game server. network_mode: service:relay-wg, so it has
#                no interface of its own and cannot leak around the tunnel.
#
# Two things this file does that are easy to get wrong, both explained at the
# line where they happen: the local door on the LAN, and the query port that
# must carry the same number inside and outside.
#
# The VPS side is four commands and lives in vps/README.md.
# ==========================================================================

x-images:
  wireguard: &wireguard-image ${WIREGUARD_IMAGE_TAG:-linuxserver/wireguard:${WIREGUARD_IMAGE_VERSION:-1.0.20260223-r0-ls121@sha256:bf03578ef7318ccc7675b4a82beac4d35cd0da2253194f6b6ecf61656b40f0ee}}
  game: &game-image ${GAME_IMAGE_TAG:-itzg/minecraft-server:${GAME_IMAGE_VERSION:-java25@sha256:8672e335dbef2699e2813e97ec2d4a7cbee26f7b64ec17e98c761d2eead3b968}}

services:
  relay-wg:
    image: *wireguard-image
    container_name: ${STACK_NAME:-game}-relay-wg
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    cap_add:
      # WireGuard needs to create the interface and program routes inside its
      # own namespace. It gets nothing else: the image drops the rest.
      - NET_ADMIN
      - SYS_MODULE
    # A LOCAL DOOR, BOUND TO THE LAN ADDRESS AND NOTHING ELSE.
    #
    # Without this, a player in the same house reaches their own server by
    # going out to the relay and back. That is a round trip to another country
    # for a machine in the next room: measured at 90 ms where the LAN answers
    # in under 1 ms. The explicit address means nothing is opened to the
    # internet; everyone outside still arrives through the tunnel.
    #
    # Set LAN_BIND_ADDRESS to this host's LAN address, never to 0.0.0.0.
    ports:
      - "${LAN_BIND_ADDRESS:?set LAN_BIND_ADDRESS to this host's LAN address}:${GAME_PORT:-25565}:${GAME_PORT:-25565}/${GAME_PROTOCOL:-tcp}"
    volumes:
      - ./config:/config
      - /lib/modules:/lib/modules:ro
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    # Bounded so a leak here cannot pick a victim elsewhere: with no limit the
    # kernel's OOM killer chooses its victim by size, which means the process
    # it kills is rarely the one at fault. This sidecar peaks at 13 MB; the
    # kernel does the cryptography.
    mem_limit: ${RELAY_MEMORY_LIMIT:-128m}
    healthcheck:
      # Proves the tunnel carries traffic, not merely that the interface is up.
      # An interface with no handshake looks identical to a working one. This
      # depends on PersistentKeepalive being set in the peer configuration; see
      # vps/README.md for why a relay peer cannot go quiet.
      test: ["CMD-SHELL", "wg show wg0 latest-handshakes | awk '{ exit ($2 > 0 && systime() - $2 < 300) ? 0 : 1 }'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  game:
    image: *game-image
    container_name: ${STACK_NAME:-game}-server
    security_opt:
      - no-new-privileges:true
    # The whole point: no interface of its own. Every packet this container
    # sends leaves through the sidecar's tunnel, including DNS. If the tunnel
    # is down the server is unreachable rather than reachable by the wrong path.
    network_mode: service:relay-wg
    depends_on:
      relay-wg:
        condition: service_healthy
    volumes:
      - game-data:/data
    environment:
      EULA: "TRUE"
      TYPE: ${GAME_TYPE:-PAPER}
      MEMORY: ${GAME_HEAP:-2G}
      # THE QUERY PORT MUST CARRY THE SAME NUMBER INSIDE AND OUTSIDE.
      #
      # A server directory records the port the server BINDS, not the port you
      # forwarded. Publish 27020 on the outside while the game binds 27015 and
      # the directory sends players to 27015 on the relay, where a different
      # server answers. The game connection succeeds, the directory handshake
      # fails against the wrong game, and the logs blame the client.
      SERVER_PORT: ${GAME_PORT:-25565}
      ENABLE_QUERY: "true"
      QUERY_PORT: ${GAME_PORT:-25565}
    mem_limit: ${GAME_MEMORY_LIMIT:-4g}
    # memswap_limit equal to mem_limit sets this container's swap to zero. A
    # game server that swaps is a game server every player can feel.
    memswap_limit: ${GAME_MEMORY_LIMIT:-4g}
    restart: unless-stopped

volumes:
  game-data:

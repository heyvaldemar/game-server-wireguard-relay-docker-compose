name: Deployment Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily: upstream repushes tags, and a relay whose image moved under it is
    # exactly the failure this repository is about.
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts and workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine:stable \
            shellcheck ./tests/*.sh

      - name: actionlint
        run: docker run --rm -v "$PWD:/mnt" -w /mnt rhysd/actionlint:1.7.12 -color

      - name: The local door must never be published to every interface
        run: |
          # The single value this template exists to protect. A commit that
          # binds the game port to 0.0.0.0 undoes the whole design quietly.
          if grep -nE '^\s*-\s*"0\.0\.0\.0:' ./*.yml; then
            echo "::error::a port is published on 0.0.0.0, which exposes the game to every interface"
            exit 1
          fi
          grep -q 'LAN_BIND_ADDRESS:?' ./*.yml || {
            echo "::error::LAN_BIND_ADDRESS lost its :? guard, so a missing value would bind everywhere"
            exit 1
          }
          echo "The local door is bound to one address and the guard is in place."

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wireguard
            env_var: WIREGUARD_IMAGE_TAG
          - name: game
            env_var: GAME_IMAGE_TAG
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\\$\\{${ENV_VAR}:-.*" game-server-wireguard-relay-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  compose:
    name: The shipped compose file parses and keeps its promises
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the compose file with the shipped defaults
        # The isolation suite builds a miniature out of plain `docker run`, so
        # it proves the pattern and never touches this file. Nothing did: the
        # compose file could stop parsing entirely and CI would stay green.
        #
        # The stack cannot be started here - the sidecar needs a peer on a
        # relay that does not exist on a runner, and the game waits for its
        # handshake. What can be checked is that the file resolves at all,
        # that every variable it needs is declared, and that the properties
        # this repository argues for survive in the resolved output.
        run: |
          cp .env.example .env
          sed -i 's/^LAN_BIND_ADDRESS=.*/LAN_BIND_ADDRESS=192.0.2.10/' .env
          docker compose -f game-server-wireguard-relay-docker-compose.yml config > /tmp/resolved.yml
          echo "compose resolved:"
          head -5 /tmp/resolved.yml

      - name: The game has no network of its own
        # The whole design rests on this line. If it is ever dropped the game
        # gets a bridge address, publishes its own ports, and the home address
        # this exists to hide is on the internet.
        run: |
          grep -q 'network_mode: service:relay-wg' /tmp/resolved.yml \
            || { echo "::error::the game no longer shares the sidecar's network namespace"; exit 1; }
          echo "game runs inside the sidecar's namespace"

      - name: The local door is bound to one address, never 0.0.0.0
        # Read the resolved structure rather than grepping around it: compose
        # writes the binding as a `host_ip` key several lines away from
        # `published`, so a proximity grep answers about the wrong thing. An
        # ABSENT host_ip is the failure - that is what publishing on every
        # interface looks like once resolved.
        run: |
          python3 - <<'EOF'
          import yaml, sys
          d = yaml.safe_load(open('/tmp/resolved.yml'))
          bad = []
          for name, svc in d.get('services', {}).items():
              for p in svc.get('ports', []) or []:
                  ip = p.get('host_ip')
                  if not ip or ip in ('0.0.0.0', '::'):
                      bad.append(f"{name}: {p.get('published')} bound to {ip or 'every interface'}")
                  elif ip != '192.0.2.10':
                      bad.append(f"{name}: {p.get('published')} bound to {ip}, not LAN_BIND_ADDRESS")
          if bad:
              print("::error::" + "; ".join(bad)); sys.exit(1)
          print("every published port is bound to LAN_BIND_ADDRESS")
          EOF

      - name: Swap is off where it would be felt
        # A game server that swaps is one every player notices, so
        # memswap_limit equals mem_limit on the game container.
        run: |
          python3 - <<'EOF'
          import yaml
          d = yaml.safe_load(open('/tmp/resolved.yml'))
          g = d['services']['game']
          mem, swap = g.get('mem_limit'), g.get('memswap_limit')
          assert mem and swap and mem == swap, f"memswap_limit {swap} does not equal mem_limit {mem}"
          print(f"swap disabled on the game container (both {mem})")
          EOF

  isolation:
    name: The game cannot be reached around its relay
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load the WireGuard kernel module if the runner has it
        run: sudo modprobe wireguard || echo "no kernel module, the image falls back to wireguard-go"

      - name: Run the relay isolation tests
        run: ./tests/e2e-relay-isolation.sh

      - name: Show container logs on failure
        if: failure()
        run: |
          for c in relay-test-vps relay-test-wg relay-test-probe; do
            echo "--- $c"; docker logs "$c" 2>&1 | tail -30 || true
          done

  check-pin-freshness:
    name: Check pinned images for upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned digests against what each tag resolves to now
        run: |
          status=0
          for var in WIREGUARD_IMAGE_TAG GAME_IMAGE_TAG; do
            pin="$(grep -m1 -oE "\\\$\\{${var}:-.*" game-server-wireguard-relay-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
            ref="${pin%%@*}"
            pinned_digest="${pin##*@}"
            # Three attempts: an unanswered registry lookup used to leave this
            # empty, and the comparison below then reported it as drift.
            current_digest=""
            for attempt in 1 2 3; do
              current_digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')"
              [ -n "$current_digest" ] && break
              sleep $(( attempt * 5 ))
            done
            if [ -z "$current_digest" ]; then
              echo "::error::${ref} did not resolve after three attempts: the registry did not answer, or the tag is gone. The pin itself is unchanged."
              status=1
              continue
            fi
            if [ "$pinned_digest" != "$current_digest" ]; then
              echo "::error::${var} digest drift: pinned ${pinned_digest}, but ${ref} now resolves to ${current_digest}"
              status=1
            else
              echo "${var} OK (${ref})"
            fi
          done
          exit "$status"

name: Pin Freshness

# ITS OWN WORKFLOW, SO THE BADGE MEANS WHAT A READER THINKS IT MEANS.
#
# This job used to run inside Deployment Verification, whose badge is the one
# on the README and in the catalogue. It is a designed alarm: it goes red when
# a pin falls behind upstream, and the fleet's triage moves the pin within the
# day. Measured across the fleet over fourteen days, nine red runs in ten were
# this alarm and nothing else, and a visitor cannot tell "one version behind"
# from "does not boot". The job below is unchanged; only its address moved.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily: upstream repushes tags, and a relay whose image moved under it is
    # exactly the failure this repository is about.
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: pin-freshness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-pin-freshness:
    name: Check pinned images for upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned digests against what each tag resolves to now
        run: |
          # A NEW INDEX OVER THE SAME BUILD IS NOT DRIFT. A multi-platform tag
          # names an index, and an index can be pushed again over the very same
          # images: a platform added or dropped, an attestation rewritten. What
          # runs here, and what CI proves, is the linux/amd64 build, so a moved
          # digest is drift only when the linux/amd64 build under it moved too.
          # The fleet's triage reads it the same way and moves no pin for a
          # re-pushed index, so failing here would keep this check red for an
          # image nobody rebuilt. A build that cannot be read is still drift.
          amd64_build() { # amd64_build <name:tag@digest> -> its linux/amd64 build; nothing if unreadable
            local raw
            raw="$(docker buildx imagetools inspect --raw "$1" 2>/dev/null)" || return 0
            if jq -e '(.manifests? | type) == "array"' <<<"$raw" >/dev/null 2>&1; then
              jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and ((.platform.variant // "") == ""))][0].digest // empty' <<<"$raw" 2>/dev/null || true
            elif jq -e '.config? != null' <<<"$raw" >/dev/null 2>&1; then
              printf '%s\n' "${1##*@}"
            fi
          }
          new_build() { # new_build <name:tag> <pinned digest> <current digest> -> 0 unless both carry one linux/amd64 build
            local was now
            was="$(amd64_build "$1@$2")"; now="$(amd64_build "$1@$3")"
            if [ -n "$was" ] && [ "$was" = "$now" ]; then
              echo "::notice::$1 index moved from $2 to $3 over the same linux/amd64 build $was: the image did not change and the pin stays"
              return 1
            fi
            return 0
          }
          status=0
          for var in WIREGUARD_IMAGE_TAG GAME_IMAGE_TAG; do
            pin="$(grep -m1 -oE "\\\$\\{${var}:-.*" game-server-wireguard-relay-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
            ref="${pin%%@*}"
            pinned_digest="${pin##*@}"
            # Three attempts: an unanswered registry lookup used to leave this
            # empty, and the comparison below then reported it as drift.
            current_digest=""
            for attempt in 1 2 3; do
              current_digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')"
              [ -n "$current_digest" ] && break
              sleep $(( attempt * 5 ))
            done
            if [ -z "$current_digest" ]; then
              echo "::error::${ref} did not resolve after three attempts: the registry did not answer, or the tag is gone. The pin itself is unchanged."
              status=1
              continue
            fi
            if [ "$pinned_digest" != "$current_digest" ] && new_build "$ref" "$pinned_digest" "$current_digest"; then
              echo "::error::${var} digest drift: pinned ${pinned_digest}, but ${ref} now resolves to ${current_digest}"
              status=1
            else
              echo "${var} OK (${ref})"
            fi
          done
          exit "$status"
